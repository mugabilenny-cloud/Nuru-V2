<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NURU – Jobs</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='28'%3E🔆%3C/text%3E%3C/svg%3E">
<style>
:root{--a:#d98200;--bg:#faf9f5;--c:#fff;--t:#1d1b16;--m:#6b665c;--b:#e6e2d8}
@media(prefers-color-scheme:dark){:root{--bg:#15130f;--c:#1f1c16;--t:#f1ede2;--m:#a29c8e;--b:#332f26}}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--t)}
a{color:inherit}header{position:sticky;top:0;z-index:5;background:var(--c);border-bottom:1px solid var(--b);display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;padding:10px 16px}
.logo{font-weight:800;font-size:20px;text-decoration:none;color:var(--a)}nav{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:14px}nav a{text-decoration:none;color:var(--m)}
main{max-width:860px;margin:0 auto;padding:16px}h1{font-size:26px;margin:8px 0}h2{font-size:18px;margin:22px 0 8px}.m{color:var(--m);font-size:14px}
.card,.box{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:12px;margin:8px 0}.card{display:flex;gap:12px;align-items:flex-start}
.tile{width:52px;height:52px;border-radius:10px;background:#fbe3b8;color:#7a4a00;display:grid;place-items:center;font-weight:700;overflow:hidden;flex:none}.tile img{width:100%;height:100%;object-fit:cover}
.grow{flex:1;min-width:0}.grow b a{text-decoration:none}.chip{display:inline-block;border:1px solid var(--b);border-radius:99px;padding:2px 10px;font-size:13px;margin:2px;text-decoration:none;color:var(--m)}.chip.warn{border-color:var(--a);color:var(--a)}
input,select,textarea,button{font:inherit;color:inherit;background:var(--c);border:1px solid var(--b);border-radius:8px;padding:9px 10px;max-width:100%}textarea{width:100%;min-height:80px}
button,.btn{cursor:pointer}.pri{background:var(--a);color:#fff;border-color:var(--a);font-weight:600;text-decoration:none;display:inline-block;padding:9px 14px;border-radius:8px;margin:3px 0}
form.row{display:flex;flex-wrap:wrap;gap:8px}form.row>*{flex:1 1 140px}form.col{display:grid;gap:8px}label{font-size:13px;color:var(--m)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}.stats div{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:10px}.stats b{font-size:24px;display:block}
.bars{display:flex;align-items:flex-end;gap:8px;height:120px}.bars div{flex:1;text-align:center;font-size:12px;color:var(--m)}.bars i{display:block;background:var(--a);border-radius:4px 4px 0 0;min-height:2px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{text-align:left;padding:6px 4px;border-bottom:1px solid var(--b)}footer{text-align:center;padding:24px;font-size:13px;color:var(--m)}
</style></head><body>
<header><a class="logo" href="#/">🔆 NURU</a><nav id="nav"></nav></header><main id="app">Loading…</main>
<footer>NURU · <a href="#/dashboard">Dashboard</a> · <a href="#/settings">Settings</a></footer>
<script>
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let J=[],S=Object.assign({user:null,saved:[],applied:{},alerts:[],follow:[],ev:[]},(()=>{try{return JSON.parse(localStorage.nuru)}catch{return{}}})());
const keep=()=>{try{localStorage.nuru=JSON.stringify(S)}catch{}},uid=()=>S.user?S.user.id:(S.anon=S.anon||Math.random().toString(36).slice(2,10));
function track(type,o={}){const e={t:Date.now(),type,uid:uid(),job:o.job||'',q:o.q||''};S.ev=[...S.ev,e].slice(-500);keep();
  try{fetch('/api/nuru',{method:'POST',keepalive:true,headers:{'content-type':'application/json'},body:JSON.stringify({...e,user:o.user})}).catch(()=>{})}catch{}}
const dl=j=>j.deadline?Math.ceil((new Date(j.deadline+'T23:59:59')-Date.now())/864e5):999,live=()=>J.filter(j=>dl(j)>=0),byId=id=>J.find(j=>j.id===id);
const pay=j=>j.salary_min?`${j.currency} ${j.salary_min.toLocaleString()}${j.salary_max?'–'+j.salary_max.toLocaleString():''}`:'';
const tile=j=>`<div class=tile>${j.image?`<img src="${E(j.image)}" alt="" loading=lazy onerror="this.remove()">`:''}${E(j.employer[0])}</div>`;
const left=j=>{const n=dl(j);if(n===999)return'<span class=chip>Open</span>';return n<0?'<span class="chip warn">Closed</span>':`<span class="chip ${n<=3?'warn':''}">${n} day${n==1?'':'s'} left</span>`};
const card=j=>`<div class=card>${tile(j)}<div class=grow><b><a href="#/job/${j.id}">${E(j.title)}</a></b>${j.verified?' ✅':''}<div class=m><a href="#/company/${encodeURIComponent(j.employer)}">${E(j.employer)}</a> · ${E(j.location)} · ${E(j.type)}</div><div class=m>${pay(j)} ${left(j)}</div></div><button data-a=save data-v="${j.id}">${S.saved.includes(j.id)?'★':'☆'}</button></div>`;
const secs=()=>[...new Set(J.map(j=>j.section))],cats=()=>[...new Set(J.map(j=>j.category))];
const sf=p=>`<form id=sf class=row><input name=q placeholder="Job title, skill or employer" value="${E(p.q||'')}"><select name=sec><option value="">Jobs &amp; scholarships</option>${secs().map(c=>`<option ${p.sec===c?'selected':''}>${E(c)}</option>`).join('')}</select><select name=cat><option value="">All categories</option>${cats().map(c=>`<option ${p.cat===c?'selected':''}>${E(c)}</option>`).join('')}</select><select name=type><option value="">Any type</option>${['Full-time','Part-time','Contract','Internship','Volunteer','Scholarship'].map(c=>`<option ${p.type===c?'selected':''}>${c}</option>`).join('')}</select><button class=pri>Search</button></form>`;
const find=p=>{const q=(p.get('q')||'').toLowerCase(),c=p.get('cat'),t=p.get('type'),sc=p.get('sec');return live().filter(j=>(!q||[j.title,j.employer,j.location,j.category,j.description].join(' ').toLowerCase().includes(q))&&(!sc||j.section===sc)&&(!c||j.category===c)&&(!t||j.type===t))};
const field=(n,l,v='',t='text')=>`<div><label>${l}</label><input name=${n} type=${t} value="${E(v)}"></div>`;
const V={};
V.home=()=>`<h1>Find work that fits.</h1>${sf({})}<p>${cats().map(c=>`<a class=chip href="#/jobs?cat=${encodeURIComponent(c)}">${E(c)}</a>`).join('')}</p><h2>Latest</h2>${live().slice(0,6).map(card).join('')||'<p class=m>No open jobs.</p>'}<h2>Closing soon</h2>${live().sort((a,b)=>dl(a)-dl(b)).slice(0,3).map(card).join('')}`;
V.jobs=p=>{const r=find(p);return`<h1>Jobs</h1>${sf(Object.fromEntries(p))}<p class=m>${r.length} result(s) <button data-a=alert>🔔 Alert me</button></p>${r.map(card).join('')||'<p>No matches. Try fewer filters.</p>'}`};
V.job=(p,id)=>{const j=byId(id);if(!j)return'<p>Job not found.</p>';return`<div class=card>${tile(j)}<div class=grow><h1>${E(j.title)}</h1><div class=m><a href="#/company/${encodeURIComponent(j.employer)}">${E(j.employer)}</a>${j.verified?' ✅ verified':''} · ${E(j.location)} · ${E(j.type)}${j.level?' · '+E(j.level):''}</div><div>${pay(j)} ${left(j)} <span class=chip>${E(j.category)}${j.sub?' / '+E(j.sub):''}</span></div></div></div><a class=pri href="#/apply/${j.id}">Apply</a> <button data-a=save data-v="${j.id}">${S.saved.includes(j.id)?'★ Saved':'☆ Save'}</button> <button data-a=share data-v="${j.id}">Share</button><div class=box><h2>About the role</h2><p>${E(j.description)}</p>${j.requirements.length?`<h2>Requirements</h2><ul>${j.requirements.map(r=>`<li>${E(r)}</li>`).join('')}</ul>`:''}</div><p class=m><a href="mailto:?subject=Report NURU job ${j.id}">Report this job</a> · Never pay to apply.</p>`};
V.apply=(p,id)=>{const j=byId(id);if(!j)return'<p>Job not found.</p>';const u=S.user||{},msg=`Hello, I am applying for ${j.title}. ${u.name||''} ${u.cv?'CV: '+u.cv:''}`;
  const href=l=>l.kind==='apply_email'?`mailto:${l.url}?subject=${encodeURIComponent('Application: '+j.title)}&body=${encodeURIComponent(msg)}`:l.kind==='apply_whatsapp'?`https://wa.me/${l.url.replace(/\D/g,'')}?text=${encodeURIComponent(msg)}`:l.url;
  return`<h1>Apply: ${E(j.title)}</h1><p class=m>${E(j.employer)} · deadline ${E(j.deadline)}. ${S.user?'Your profile details are added to the message.':'<a href="#/signin">Sign in</a> to add your profile to the message.'}</p>${j.links.map(l=>`<div class=box><b>${E(l.label)}</b><br><a class=pri ${l.kind.startsWith('apply')?`data-a=applied data-v="${j.id}"`:''} target=_blank rel=noopener href="${E(href(l))}">${l.kind.startsWith('apply')?'Apply via '+E(l.kind.slice(6)):'Open'}</a></div>`).join('')}<p class=m>${S.applied[j.id]?'✅ Marked as applied.':''}</p>`};
V.saved=()=>`<h1>Saved &amp; applied</h1><h2>Saved</h2>${S.saved.map(byId).filter(Boolean).map(card).join('')||'<p class=m>Nothing saved yet.</p>'}<h2>Applied</h2>${Object.keys(S.applied).map(byId).filter(Boolean).map(card).join('')||'<p class=m>No applications yet.</p>'}`;
V.alerts=()=>`<h1>Job alerts</h1><p class=m>Alerts are saved searches. Open a search and tap “Alert me”. Email/WhatsApp delivery needs a backend; for now you see live match counts.</p>${S.alerts.map((a,i)=>{const p=new URLSearchParams(a);return`<div class=box><b>${E(a.q||'Any job')} ${E(a.cat||'')}</b> <span class=m>${find(p).length} matches now</span> <a class=chip href="#/jobs?${E(a)}">View</a> <button data-a=delalert data-v=${i}>Delete</button></div>`}).join('')||'<p>No alerts yet.</p>'}`;
V.signin=()=>S.user?`<h1>Hi, ${E(S.user.name)}</h1><p class=m>${E(S.user.email)} · ${E(S.user.role)}</p><a class=pri href="#/profile">Edit profile</a> <button data-a=out>Sign out</button>`:`<h1>Create your NURU account</h1><p class=m>Free for job seekers, always. Identity is not verified in this version.</p><form id=su class=col>${field('name','Full name')}${field('email','Email','','email')}<div><label>I am a</label><select name=role><option>Job seeker</option><option>Employer</option></select></div><button class=pri>Sign up</button></form>`;
V.profile=()=>{const u=S.user;if(!u)return'<p><a href="#/signin">Sign in</a> first.</p>';const f=['headline','skills','phone','cv','summary'],pct=Math.round(f.filter(k=>u[k]).length/f.length*100);
  return`<h1>My profile</h1><div class=box>Profile ${pct}% complete</div><form id=pf class=col>${field('headline','Headline',u.headline)}${field('skills','Skills (comma separated)',u.skills)}${field('phone','Phone / WhatsApp',u.phone)}${field('cv','CV link (Drive or website)',u.cv,'url')}<div><label>Summary</label><textarea name=summary>${E(u.summary||'')}</textarea></div><button class=pri>Save</button></form>`};
V.company=(p,id)=>{const n=decodeURIComponent(id),js=J.filter(j=>j.employer===n),f=S.follow.includes(n);return`<div class=card>${js[0]?tile(js[0]):''}<div class=grow><h1>${E(n)}${js.some(j=>j.verified)?' ✅':''}</h1><div class=m>${js.length} open role(s)</div></div><button data-a=follow data-v="${E(n)}">${f?'Following ✓':'Follow'}</button></div>${js.map(card).join('')}`};
V.post=()=>`<h1>Add a listing</h1><p class=m>NURU reads <code>data/hub_repo.xlsx</code>. Fill this in, copy the row, paste it as a new row at the bottom of the sheet (columns: path, title, url, details) and commit. Posting is free; never charge candidates.</p><form id=pj class=row><div><label>Section</label><select name=sec><option>Jobs</option><option>Scholarships</option></select></div>${field('cat','Category (e.g. Medical)')}${field('employer','Employer')}${field('title','Job title')}${field('url','Listing URL','','url')}${field('location','Location')}${field('close','Closing date','','date')}<textarea name=desc placeholder="Requirements and how to apply (include an email address to enable email apply)"></textarea><button class=pri>Make row</button></form><textarea id=out readonly placeholder="Your row appears here (tab-separated)"></textarea>`;
V.resources=()=>{const m={};J.filter(j=>j.salary_min).forEach(j=>(m[j.category]=m[j.category]||[]).push(j));return`<h1>Career resources</h1><div class=box><h2>Avoid scams</h2><ul><li>Never pay a fee to apply or to “process” a job.</li><li>Check for the verified ✅ badge and a real contact.</li><li>Never share ID or bank details before an interview.</li></ul></div><div class=box><h2>CV tips</h2><ul><li>One page, results first, clear contact details.</li><li>Match your skills to the listed requirements.</li></ul></div><div class=box><h2>Pay ranges seen on NURU</h2><table>${Object.entries(m).map(([c,a])=>`<tr><td>${E(c)}</td><td>${a[0].currency} ${Math.min(...a.map(j=>j.salary_min)).toLocaleString()} – ${Math.max(...a.map(j=>j.salary_max||j.salary_min)).toLocaleString()}</td></tr>`).join('')}</table></div>`};
V.settings=()=>`<h1>Settings &amp; privacy</h1><div class=box>Your saved jobs, applications and alerts live on this device. Activity counts (views, searches, saves, applies) and sign-up details are sent to NURU for the dashboard.</div><button data-a=export>Download my data</button> <button data-a=wipe>Delete data on this device</button>`;
V.dashboard=()=>{setTimeout(dash,0);return'<h1>Dashboard</h1><div id=dx>Loading…</div>'};
async function dash(){const k=sessionStorage.nk||'';let d,src='Shared data';
  try{const r=await fetch('/api/nuru?key='+encodeURIComponent(k));if(!r.ok)throw r.status;d=await r.json()}catch(x){d={ev:S.ev,users:S.user?[S.user]:[]};src=x===401?'Admin key missing or wrong: showing this device only':'Shared storage not connected: showing this device only (demo)'}
  const ev=d.ev,us=d.users,n=t=>ev.filter(e=>e.type===t).length,cnt=(t,f)=>{const m={};ev.filter(e=>e.type===t).forEach(e=>e[f]&&(m[e[f]]=(m[e[f]]||0)+1));return m},
  days=[...Array(7)].map((_,i)=>{const t=new Date(Date.now()-(6-i)*864e5);return[t.toLocaleDateString(undefined,{weekday:'short'}),ev.filter(e=>new Date(e.t).toDateString()===t.toDateString()).length]}),mx=Math.max(1,...days.map(x=>x[1])),
  v=cnt('view','job'),sv=cnt('save','job'),ap=cnt('apply','job'),se=Object.entries(cnt('search','q')).sort((a,b)=>b[1]-a[1]).slice(0,8),roles={};us.forEach(u=>roles[u.role]=(roles[u.role]||0)+1);
  $('#dx').innerHTML=`<p class=m>${E(src)} <form id=kf class=row style="display:inline-flex"><input name=k type=password placeholder="Admin key" value="${E(k)}"><button>Load</button></form></p>
  <div class=stats><div><b>${us.length}</b>Sign-ups</div><div><b>${new Set(ev.map(e=>e.uid)).size}</b>Visitors</div><div><b>${n('view')}</b>Job views</div><div><b>${n('search')}</b>Searches</div><div><b>${n('save')}</b>Saves</div><div><b>${n('apply')}</b>Apply clicks</div></div>
  <h2>Activity, last 7 days</h2><div class=bars>${days.map(([l,c])=>`<div>${c}<i style="height:${c/mx*90}px"></i>${l}</div>`).join('')}</div>
  <h2>Top jobs</h2><table><tr><th>Job<th>Views<th>Saves<th>Applies</tr>${J.map(j=>[j.title,v[j.id]||0,sv[j.id]||0,ap[j.id]||0]).sort((a,b)=>b[1]-a[1]).slice(0,8).map(r=>`<tr>${r.map(c=>`<td>${E(c)}`).join('')}</tr>`).join('')}</table>
  <h2>Top searches</h2>${se.map(([q,c])=>`<span class=chip>${E(q)} · ${c}</span>`).join('')||'<p class=m>None yet.</p>'}
  <h2>Sign-ups ${Object.entries(roles).map(([r,c])=>`<span class=chip>${E(r)}: ${c}</span>`).join('')}</h2><table><tr><th>Name<th>Email<th>Role<th>Joined</tr>${us.sort((a,b)=>b.t-a.t).slice(0,20).map(u=>`<tr><td>${E(u.name)}<td>${E(u.email)}<td>${E(u.role)}<td>${u.t?new Date(u.t).toLocaleDateString():''}</tr>`).join('')}</table>`}
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,v=t.dataset.v;
  if(a==='save'){const i=S.saved.indexOf(v);i<0?(S.saved.push(v),track('save',{job:v})):S.saved.splice(i,1);keep();route()}
  if(a==='applied'){S.applied[v]=Date.now();track('apply',{job:v});keep()}
  if(a==='share'){const u=location.href;navigator.share?navigator.share({title:byId(v).title,url:u}):navigator.clipboard.writeText(u).then(()=>alert('Link copied'))}
  if(a==='alert'){S.alerts.push(location.hash.split('?')[1]||'');keep();location.hash='#/alerts'}
  if(a==='delalert'){S.alerts.splice(+v,1);keep();route()}
  if(a==='follow'){const i=S.follow.indexOf(v);i<0?S.follow.push(v):S.follow.splice(i,1);keep();route()}
  if(a==='out'){S.user=null;keep();route();nav()}
  if(a==='wipe'&&confirm('Delete all NURU data on this device?')){localStorage.removeItem('nuru');location.reload()}
  if(a==='export'){const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),l=document.createElement('a');l.href=URL.createObjectURL(b);l.download='nuru-data.json';l.click()}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,d=Object.fromEntries(new FormData(f));
  if(f.id==='sf'){track('search',{q:d.q});location.hash='#/jobs?'+new URLSearchParams(Object.entries(d).filter(x=>x[1]))}
  if(f.id==='su'){S.user={id:'u'+Math.random().toString(36).slice(2,10),name:d.name,email:d.email,role:d.role,t:Date.now()};keep();track('signup',{user:S.user});nav();location.hash='#/profile'}
  if(f.id==='pf'){Object.assign(S.user,d);keep();alert('Saved');route()}
  if(f.id==='kf'){sessionStorage.nk=d.k;dash()}
  if(f.id==='pj'){const c=d.close?` Closes ${new Date(d.close+'T00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}.`:' No closing date stated.';const r=[d.sec+'/'+d.cat,d.employer+' - '+d.title,d.url,d.location+'.'+c+' '+d.desc].map(x=>x.replace(/[\t\r\n]+/g,' '));$('#out').value=r.join('\t');$('#out').select()}});
const nav=()=>$('#nav').innerHTML=`<a href="#/jobs">Jobs</a><a href="#/saved">Saved (${S.saved.length})</a><a href="#/alerts">Alerts</a><a href="#/post">Post a job</a><a href="#/resources">Resources</a><a href="#/signin">${S.user?E(S.user.name.split(' ')[0]):'Sign in'}</a>`;
function route(first){const[path,qs]=(location.hash.slice(2)||'').split('?'),[r,id]=path.split('/'),p=new URLSearchParams(qs||''),k=V[r||'home']?r||'home':'home';
  if(first&&k==='job')track('view',{job:id});$('#app').innerHTML=V[k](p,id);if(first)scrollTo(0,0);nav()}
addEventListener('hashchange',()=>route(1));
fetch('jobs.json').then(r=>r.json()).then(d=>{J=d.jobs;route(1)}).catch(()=>$('#app').textContent='Could not load jobs.');
</script></body></html>
